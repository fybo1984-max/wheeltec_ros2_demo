mapping_ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom_combined
    base_link_frame: base_footprint
    world_frame: odom_combined

    # Use calibrated chassis velocity for large-corridor mapping. Controlled
    # 90-degree turns showed this source is much more consistent than the
    # onboard IMU in both directions.
    odom0: /odom_mapping
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

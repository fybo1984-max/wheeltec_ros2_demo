schema_version: 1
study_id: semantic_costmap_paper_pilot_v1
description: >-
  Controller-free synthetic pilot for safety-efficiency policy and temporal
  recovery before recorded RGB-D and physical AGV experiments.
output_root: /tmp/semantic_costmap_paper_pilot_v1
domain_id_start: 90

defaults:
  package: semantic_planning_experiments
  launch_file: generator_planner_ab.launch.py
  repetitions: 3
  parameters:
    start_x: 6.0
    start_y: 0.0
    start_yaw: 0.0
    goal_x: 20.0
    goal_y: 0.0
    goal_yaw: 0.0
    detection_active_duration_sec: 0.0
    observation_hold_sec: 60.0
    observation_decay_sec: 60.0
    recovery_timeout_seconds: 0.0

scenarios:
  - id: person_center_safety
    research_question: RQ1
    hypothesis: High avoidance eliminates semantic-zone crossing when a detour exists.
    factors:
      risk_source: synthetic_person
      risk_position: route_center
      policy: safety
    parameters:
      task_urgency: 0
      avoidance_level: 100.0
    acceptance:
      - metric: semantic.semantic_crossing_length_m
        operator: le
        value: 0.05
      - metric: semantic.minimum_semantic_clearance_m
        operator: ge
        value: 1.0

  - id: person_center_balanced
    research_question: RQ2
    hypothesis: Balanced policy avoids the risk with bounded path overhead.
    factors:
      risk_source: synthetic_person
      risk_position: route_center
      policy: balanced
    parameters:
      task_urgency: 5
      avoidance_level: 70.0
    acceptance:
      - metric: semantic.semantic_crossing_length_m
        operator: le
        value: 0.05
      - metric: delta_semantic_minus_baseline.path_length_m
        operator: le
        value: 4.5

  - id: person_center_urgent
    research_question: RQ2
    hypothesis: High urgency and low avoidance recover the geometrically short route.
    factors:
      risk_source: synthetic_person
      risk_position: route_center
      policy: urgent
    parameters:
      task_urgency: 10
      avoidance_level: 0.0
    acceptance:
      - metric: semantic.semantic_crossing_length_m
        operator: ge
        value: 2.0
      - metric: semantic.path_length_m
        operator: le
        value: 14.1

  - id: person_center_decay_recovery
    research_question: RQ3
    hypothesis: Clearing a decayed risk restores the baseline path exactly.
    factors:
      risk_source: synthetic_person
      risk_position: route_center
      policy: balanced
      temporal_event: detection_stops
    repetitions: 2
    parameters:
      task_urgency: 0
      avoidance_level: 70.0
      detection_active_duration_sec: 30.0
      observation_hold_sec: 0.5
      observation_decay_sec: 1.0
      recovery_timeout_seconds: 15.0
    acceptance:
      - metric: semantic.semantic_crossing_length_m
        operator: le
        value: 0.05
      - metric: delta_recovered_minus_baseline.path_length_m
        operator: eq
        value: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: MAP_YAML_PATH

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 10.0
      motion_model_for_search: "REEDS_SHEPP"
      cost_travel_multiplier: 2.0
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_cost: 200.0
      minimum_turning_radius: 0.80
      reverse_penalty: 1.5
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 3.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: semantic_experiment_base
      use_sim_time: false
      footprint: "[[-0.09, -0.185], [-0.09, 0.185], [0.4, 0.185], [0.4, -0.185]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "mask_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      mask_layer:
        plugin: "semantic_costmap_plugin::MaskLayer"
        enabled: false
        mask_source: "file"
        map_yaml_path: MASK_YAML_PATH
        mask_topic: "/semantic_mask"
        mask_cost_value: 125
        task_urgency: 0
        avoidance_level: 70.0
        inflation_radius: 0.5
        cost_scaling_factor: 2.0
        inflate_unknown: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
